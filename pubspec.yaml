name: portfolio_luan
description: "Portfólio pessoal de Luan Nunes (iOS, Android e Web)."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#EFE6CC"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#EFE6CC"
    theme_color: "#1E3441"

flutter_native_splash:
  color: "#1E3441"
  image: "assets/branding/splash.png"
  android_12:
    image: "assets/branding/splash.png"
    color: "#1E3441"
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/data/
    - assets/docs/
    - assets/icons/
    - assets/images/
    - assets/images/projects/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
